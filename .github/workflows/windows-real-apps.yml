name: Windows real software execution experiments
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-real-apps.yml"
      - "kernel/chrome_trial.c"
      - "kernel/process.c"
      - "kernel/win32_*.c"
      - "kernel/win32_*.h"
      - "apps/win32_*.c"
      - "tests/win32_*.c"
      - "Makefile"
      - "tools/windows_pe_probe.py"
permissions:
  contents: read
concurrency:
  group: winapps-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, FAT16, build and extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib nasm python3-pil fonts-dejavu-core \
            dosfstools mtools parted grub-pc-bin grub-common qemu-utils \
            qemu-system-x86 zlib1g-dev p7zip-full xz-utils gcc-mingw-w64-i686
      - name: Compile Bordify guest and run original tests
        run: |
          make test
          make -j"$(nproc)" CHROME_PROBE=1
          make build/apps/winreal.exe build/apps/wincrt.exe build/apps/bordll.dll build/apps/chain.dll build/apps/init.dll build/apps/bfail.dll build/apps/winstat.exe
          # Probe the negative fixture as a genuine relocatable image.
          i686-w64-mingw32-objdump -p build/apps/bfail.dll |
            grep -E "Base Relocation Directory|ImageBase|AddressOfEntryPoint"
          # Verify the actual independently built PE32 DLL image on the host,
          # before attempting native exported code inside the QEMU guest.
          echo '[pe-dll] compiler-produced DLL image metadata:'
          i686-w64-mingw32-objdump -p build/apps/bordll.dll | sed -n '1,115p'
          echo '[pe-dll] PE section metadata:'
          i686-w64-mingw32-objdump -h build/apps/bordll.dll
          ./build/tests/win32_pe_dll_test build/apps/bordll.dll
          sudo bash scripts/build-image.sh
      - name: Download genuine Google Chrome installers and 7-Zip utility
        run: |
          set -euo pipefail
          mkdir -p build/windows
          curl -fLsS --retry 3 --max-time 360 -o build/windows/ChromeStandaloneSetup64.exe \
            https://dl.google.com/chrome/install/ChromeStandaloneSetup64.exe
          curl -fLsS --retry 3 --max-time 180 -o build/windows/7zr.exe \
            https://www.7-zip.org/a/7zr.exe
          if ! curl -fLsS --retry 1 --max-time 120 -o build/windows/ChromeSetup.exe \
            https://dl.google.com/chrome/install/ChromeSetup.exe; then
            rm -f build/windows/ChromeSetup.exe
          fi
          ls -lh build/windows
      - name: Analyze real PE executable images and Windows API dependencies
        run: |
          set -euo pipefail
          python3 tools/windows_pe_probe.py \
            build/windows/ChromeStandaloneSetup64.exe build/windows/7zr.exe \
            --output build/windows-dependencies.json | tee build/windows-dependencies.txt
          if [ -f build/windows/ChromeSetup.exe ]; then
            python3 tools/windows_pe_probe.py build/windows/ChromeSetup.exe \
              --output build/windows-web-setup-dependencies.json \
              | tee build/windows-web-setup-dependencies.txt
          fi
          # The real 7zr.exe must expose actionable dependency evidence.
          # Never interpret this as execution or compatibility.
          python3 - <<'PY'
          import json
          from pathlib import Path
          results = json.loads(Path("build/windows-dependencies.json").read_text())
          seven = next(x for x in results if x["filename"].lower() == "7zr.exe")
          assert seven["total_imports"] > 0, "7zr import table not parsed"
          assert seven["missing_imports_count"] == (
              sum(len(seven["dlls"][name]) for name in seven["missing_modules"])
              + seven["missing_exports_count"]
          ), "inconsistent missing dependency classification"
          print("[winprobe] 7zr unresolved DLL modules:", seven["missing_modules"])
          print("[winprobe] 7zr unresolved exports:", seven["missing_exports"][:12])
          PY
          python3 tools/windows_pe_probe.py build/apps/winreal.exe \
            --output build/windows-compiler-demo.json \
            | tee build/windows-compiler-demo.txt
          python3 tools/windows_pe_probe.py build/apps/wincrt.exe \
            --output build/windows-crt-compiler-demo.json \
            | tee build/windows-crt-compiler-demo.txt
          {
            echo '## Windows compatibility API gap analysis'
            echo '~~~'
            cat build/windows-dependencies.txt
            cat build/windows-web-setup-dependencies.txt 2>/dev/null || true
            cat build/windows-compiler-demo.txt
            cat build/windows-crt-compiler-demo.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Try extracting actual Chrome executable from offline installer
        run: |
          mkdir -p build/windows/extracted
          set +e
          timeout 40s 7z l -slt build/windows/ChromeStandaloneSetup64.exe \
            > build/windows/archive-list.txt 2>&1
          list_rc=$?
          if [ "$list_rc" -eq 0 ]; then
            timeout 70s 7z x -y -o"build/windows/extracted" \
              build/windows/ChromeStandaloneSetup64.exe \
              > build/windows/archive-extraction.txt 2>&1
            extraction_rc=$?
          else
            extraction_rc=99
            echo "No supported embedded 7z/SFX archive" > build/windows/archive-extraction.txt
          fi
          set -e
          echo "[winapps] archive list=$list_rc extract=$extraction_rc"
          find build/windows/extracted -type f | head -n 30 || true
          # Chrome installers may contain chrome.7z nested inside the EXE.
          nested=$(find build/windows/extracted -type f \( -iname '*.7z' -o -iname '*.zip' \) -print -quit 2>/dev/null)
          if [ -n "$nested" ]; then
            echo "[winapps] attempting nested Chrome archive: $nested"
            mkdir -p build/windows/nested
            set +e
            timeout 80s 7z x -y -o"build/windows/nested" "$nested" \
              > build/windows/nested-extraction.txt 2>&1
            nested_rc=$?
            set -e
            echo "[winapps] nested 7z extraction status=$nested_rc"
          fi
          candidate=$(find build/windows/extracted build/windows/nested \
            -type f -iname chrome.exe -print -quit 2>/dev/null)
          if [ -n "$candidate" ]; then
            cp "$candidate" build/windows/chrome-binary.exe
            python3 tools/windows_pe_probe.py build/windows/chrome-binary.exe \
              --output build/windows/extracted-chrome-dependencies.json \
              | tee build/windows/extracted-chrome-report.txt
          else
            echo "[winapps] chrome.exe not directly extractable with 7z"
          fi
      - name: Build separate FAT16 disk containing only Windows apps
        run: |
          set -euo pipefail
          sudo chmod a+r dist/Bordify-OS.img
          cp --sparse=always dist/Bordify-OS.img build/windows-probe.img
          mcopy -i "build/windows-probe.img@@1048576" \
            build/windows/ChromeStandaloneSetup64.exe "::APPS/CHROME.EXE"
          mcopy -i "build/windows-probe.img@@1048576" \
            build/windows/7zr.exe "::APPS/SEVEN.EXE"
          mcopy -i "build/windows-probe.img@@1048576" \
            build/apps/winreal.exe "::APPS/WINREAL.EXE"
          mcopy -i "build/windows-probe.img@@1048576" \
            build/apps/wincrt.exe "::APPS/WINCRT.EXE"
          mcopy -i "build/windows-probe.img@@1048576" \
            build/apps/bordll.dll "::APPS/BORDLL.DLL"
          mcopy -i "build/windows-probe.img@@1048576" \
            build/apps/chain.dll "::APPS/CHAIN.DLL"
          mcopy -i "build/windows-probe.img@@1048576" \
            build/apps/winstat.exe "::APPS/WINSTAT.EXE"
          mcopy -i "build/windows-probe.img@@1048576" \
            build/apps/init.dll "::APPS/INIT.DLL"
          mcopy -i "build/windows-probe.img@@1048576" \
            build/apps/bfail.dll "::APPS/BFAIL.DLL"
          if [ -f build/windows/ChromeSetup.exe ]; then
            mcopy -i "build/windows-probe.img@@1048576" \
              build/windows/ChromeSetup.exe "::APPS/WEBSET.EXE"
          fi
          if [ -f build/windows/chrome-binary.exe ]; then
            mcopy -i "build/windows-probe.img@@1048576" \
              build/windows/chrome-binary.exe "::APPS/CHRMAPP.EXE"
          fi
          mcopy -i "build/windows-probe.img@@1048576" \
            "::APPS/WINIO.EXE" build/windows/old-winio.exe
          cmp build/windows/old-winio.exe build/apps/winio.exe
          mcopy -i "build/windows-probe.img@@1048576" \
            "::APPS/SETUP64.EXE" build/windows/old-setup.exe
          cmp build/windows/old-setup.exe build/apps/win64setup.exe
          echo "[winapps] existing PE32 and PE32+ demos unmodified"
      - name: Boot Bordify QEMU and try all real Win32 executables
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM 85s qemu-system-i386 \
            -drive file=build/windows-probe.img,format=raw,if=ide \
            -nic user,model=e1000 -m 128 -vga std -display none \
            -serial file:build/windows-probe-serial.log \
            -no-reboot -no-shutdown \
            >build/windows-probe-qemu.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit "$rc"; fi
          cat build/windows-probe-serial.log
          grep -F "[chrome-win] native PE32 launch attempt rejected" build/windows-probe-serial.log
          grep -F "[win32-file] ring-3 Win32 CreateFile/WriteFile/ReadFile/CloseHandle roundtrip passed" build/windows-probe-serial.log
          grep -F "[win64-install] installed AMD64 application launched; exit 0" build/windows-probe-serial.log
          for repeat in 1 2 3; do
            grep -F "[win32-stress] repeat=$repeat Win32 file roundtrip exit=0" build/windows-probe-serial.log
          done
          grep -F "BORDIFY MAPPED PE32 DLL: native MinGW export executed in ring 3" build/windows-probe-serial.log
          grep -F "BORDIFY CHAINED DLL: imported MinGW export executed in ring 3" build/windows-probe-serial.log
          grep -F "BORDIFY DYNAMIC DLL: process attach, detach, failure rollback passed" build/windows-probe-serial.log
          grep -F "[win32-dll] dynamic PROCESS_ATTACH completed in ring 3" build/windows-probe-serial.log
          grep -F "[win32-dll] dynamic PROCESS_DETACH completed in ring 3" build/windows-probe-serial.log
          grep -F "[win32-dll] dynamic PROCESS_ATTACH rejected in ring 3" build/windows-probe-serial.log
          grep -F "[winapps] independent MinGW PE32 program: native Win32 attempt returned 0" build/windows-probe-serial.log
          grep -F "[winapps] independent static-import MinGW PE32 program: native Win32 attempt returned 0" build/windows-probe-serial.log
          grep -F "BORDIFY REAL MSVCRT PE32: two DLL imports, strings and heap verified" build/windows-probe-serial.log
          grep -F "[winapps] independent two-DLL MinGW MSVCRT program: native Win32 attempt returned 0" build/windows-probe-serial.log
          grep -F "[winapps] 7-Zip standalone utility: real file size=" build/windows-probe-serial.log
          grep -F "[winapps] 7-Zip standalone utility: native Win32 attempt returned" build/windows-probe-serial.log
          grep -F "[kernel] starting desktop" build/windows-probe-serial.log
          if grep -F "PANIC" build/windows-probe-serial.log; then exit 1; fi
          {
            echo '## Actual guest-side Windows app launch attempts'
            echo '~~~'
            grep -E '\[(winapps|chrome-win|win32-file|win64-install)\]' \
              build/windows-probe-serial.log || true
            echo '~~~'
            echo 'Loading and format detection is not application execution.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reboot the SAME disk and check FAT16 Win32 persistence
        run: |
          set -euo pipefail
          printf 'BORDIFY WIN32 FILE: CreateFileA WriteFile ReadFile CloseHandle verified\r\n' > build/windows-expected.txt
          mcopy -i "build/windows-probe.img@@1048576" "::APPS/WIN32.TXT" build/windows-first-boot.txt
          cmp build/windows-first-boot.txt build/windows-expected.txt
          echo "[winapps] first boot Win32 file persisted byte-for-byte"
          set +e
          timeout --signal=TERM 50s qemu-system-i386 \
            -drive file=build/windows-probe.img,format=raw,if=ide \
            -nic user,model=e1000 -m 128 -vga std -display none \
            -serial file:build/windows-second-serial.log \
            -no-reboot -no-shutdown >build/windows-second-qemu.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit "$rc"; fi
          cat build/windows-second-serial.log
          grep -F "[win32-file] ring-3 Win32 CreateFile/WriteFile/ReadFile/CloseHandle roundtrip passed" build/windows-second-serial.log
          for repeat in 1 2 3; do
            grep -F "[win32-stress] repeat=$repeat Win32 file roundtrip exit=0" build/windows-second-serial.log
          done
          grep -F "BORDIFY MAPPED PE32 DLL: native MinGW export executed in ring 3" build/windows-second-serial.log
          grep -F "BORDIFY CHAINED DLL: imported MinGW export executed in ring 3" build/windows-second-serial.log
          grep -F "BORDIFY DYNAMIC DLL: process attach, detach, failure rollback passed" build/windows-second-serial.log
          grep -F "[win32-dll] dynamic PROCESS_ATTACH completed in ring 3" build/windows-second-serial.log
          grep -F "[win32-dll] dynamic PROCESS_DETACH completed in ring 3" build/windows-second-serial.log
          grep -F "[win32-dll] dynamic PROCESS_ATTACH rejected in ring 3" build/windows-second-serial.log
          grep -F "[winapps] independent MinGW PE32 program: native Win32 attempt returned 0" build/windows-second-serial.log
          grep -F "[winapps] independent static-import MinGW PE32 program: native Win32 attempt returned 0" build/windows-second-serial.log
          grep -F "[winapps] independent two-DLL MinGW MSVCRT program: native Win32 attempt returned 0" build/windows-second-serial.log
          grep -F "[kernel] starting desktop" build/windows-second-serial.log
          if grep -F "PANIC" build/windows-second-serial.log; then exit 1; fi
          mcopy -i "build/windows-probe.img@@1048576" "::APPS/WIN32.TXT" build/windows-second-boot.txt
          cmp build/windows-second-boot.txt build/windows-expected.txt
          echo "Two consecutive real-app QEMU boots and persistent FAT16 readbacks: PASS"
      - name: Upload logs and dependency reports (no software binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-windows-app-diagnostics
          path: |
            build/windows-dependencies.json
            build/windows-dependencies.txt
            build/windows-compiler-demo.json
            build/windows-compiler-demo.txt
            build/windows-crt-compiler-demo.json
            build/windows-crt-compiler-demo.txt
            build/windows-web-setup-dependencies.json
            build/windows-web-setup-dependencies.txt
            build/windows/archive-list.txt
            build/windows/archive-extraction.txt
            build/windows/nested-extraction.txt
            build/windows/extracted-chrome-dependencies.json
            build/windows/extracted-chrome-report.txt
            build/windows-probe-serial.log
            build/windows-probe-qemu.log
            build/windows-second-serial.log
            build/windows-second-qemu.log
            build/windows-first-boot.txt
            build/windows-second-boot.txt
          if-no-files-found: warn
          retention-days: 14
