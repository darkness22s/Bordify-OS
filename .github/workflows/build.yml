name: Build Bordify OS images

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install image toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib nasm python3-pil fonts-dejavu-core \
            dosfstools mtools parted grub-pc-bin grub-common qemu-utils xz-utils

      - name: Test foreign executable header inspection
        run: make test

      - name: Compile kernel
        run: make -j"$(nproc)"

      - name: Assemble disk images
        run: sudo bash scripts/build-image.sh

      - name: Show image hashes
        run: cat dist/SHA256SUMS

      - name: Upload bootable images
        uses: actions/upload-artifact@v4
        with:
          name: Bordify-OS-images
          path: dist/*
          if-no-files-found: error
          retention-days: 30
